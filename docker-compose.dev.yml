services:
    backend:
        build: ./backend
        ports: 
            - 4000:4000
        volumes: 
            - ./backend:/app
        depends_on:
            - postgres

    postgres:
        image: postgres:16
        restart: unless-stopped
        shm_size: 128mb
        ports:
            - "5432:5432"
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: root
            POSTGRES_DB: thegoodcorner
        volumes:
            - postgres_data:/var/lib/postgresql/data

    frontend:
        build: ./frontend
        ports: 
            - 3000:3000
        volumes:
            - ./frontend:/app
        depends_on:
            - postgres

    adminer:
        image: adminer
        restart: unless-stopped
        ports:
            - "8080:8080"
        depends_on:
            - postgres
            
